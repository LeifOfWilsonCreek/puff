[keys]
UP=KEY_UP
UP=ESC,'[','A'
UP=ESC,'O','A'
DOWN=KEY_DOWN
DOWN=ESC,'[','B'
DOWN=ESC,'O','B'
RIGHT=KEY_RIGHT
RIGHT=ESC,'[','C'
RIGHT=ESC,'O','C'
LEFT=KEY_LEFT
LEFT=ESC,'[','D'
LEFT=ESC,'O','D'
BOL=KEY_HOME            # Move to the beginning of the line
EOL=KEY_END             # Move to the end of the line
PPAGE=KEY_PPAGE
NPAGE=KEY_NPAGE
BACKSPACE=KEY_BACKSPACE
INSERT=KEY_IC
DELETE=KEY_DC
BOL=CTRL_A
SEEKBYTE=CTRL_B
CANCEL=CTRL_C
DELETE=CTRL_D
EOL=CTRL_E
FILEMENU=CTRL_F
# Instead of the FILEMENU feature, you could use the following:
# NEW=
# OPEN=
# SAVE=
# CLOSE=
# SWITCH=
BACKSPACE=CTRL_H
TAB=TAB                 # or CTRL_I
ENTER=ENTER             # or CTRL_J
CUT=CTRL_K              # insert this line at the cursor in the clipboard
REDRAW=CTRL_L           # Redraw the screen
			# Curses changes CTRL_M to CTRL_J - Ugh
CLEARCLIP=CTRL_N        # Clean off the clipboard
PASTE=CTRL_P
QSAVE=CTRL_S            # Save without prompting for name or overwrite
SEEKLINE=CTRL_T         # Seek to a line
KILL=CTRL_U             # Kill entire line
NPAGE=CTRL_V            # Next page (PgDn)
SEARCH=CTRL_W
EXIT=CTRL_X
PPAGE=CTRL_Y            # Previous page (PgUp)
SUSPEND=CTRL_Z
SPECIAL=CTRL_\          # Insert a special character
# KILLBOL=              # Kill to beginning of line
# KILLEOL=              # Kill to end of line
# Unused keys - #GOQR

[misc]
tab_size=8              # Size of tab-stops
page_skip=1             # Number of lines to overlap pageup and pagedown
save_clipboard=1        # 0 = Don't save clipboard in ~/.puff_clipboard between runs
lock_files=1            # Obtain a lock when opening files (0 = no or 1 = yes)
#color_term=1           # Force color or mono terminal.  Default depends on what curses allows
window_margin=0         # Minimum number of lines to leave above and below the cursor
seek_center=1           # Center the cursor vertically after seeking (search, seekbyte, seekline, etc)
